fr:
  lauze:
    tagline: "Rénover, sans se perdre."

  # ─── Noms des modèles (singulier + pluriel) ──────────────────────────
  # Utilisés dans les messages d'erreur, les flashs, et Property.model_name.human.
  activerecord:
    models:
      property:
        one:   "Bien"
        other: "Biens"
      document:
        one:   "Document"
        other: "Documents"
      offer:
        one:   "Offre"
        other: "Offres"
      user:
        one:   "Utilisateur"
        other: "Utilisateurs"
      valuation:
        one:   "Estimation"
        other: "Estimations"
      device_simulation:
        one:   "Simulation d'équipement"
        other: "Simulations d'équipements"
      local_aid_scheme:
        one:   "Aide locale"
        other: "Aides locales"

    # ─── Libellés des attributs ────────────────────────────────────────
    # Ces libellés remplacent les noms techniques dans les messages d'erreur.
    # Ex: au lieu de "Dpe class n'est pas inclus dans la liste", on obtient
    # "Classe DPE n'est pas inclus dans la liste".
    attributes:
      property:
        address:           "Adresse"
        city:              "Ville"
        zipcode:           "Code postal"
        surface:           "Surface"
        property_type:     "Type de bien"
        construction_year: "Année de construction"
        dpe_class:         "Classe DPE"
        dpe_target:        "Classe DPE cible"
        nb_rooms:          "Nombre de pièces"
        nb_lots:           "Nombre de lots"
        is_copropriete:    "Copropriété"
        description:       "Description"
        vacant:            "Vacant"
        vacancy_duration:  "Durée de vacance"
        vacancy_reason:    "Motif de vacance"
        source:            "Source"
        income_bracket:    "Tranche de revenus"
        status:            "Statut"
        user:              "Propriétaire"
        lat:               "Latitude"
        lng:               "Longitude"

      offer:
        amount:            "Montant"
        description:       "Description"
        offer_type:        "Type d'offre"
        status:            "Statut"
        expires_at:        "Date d'expiration"
        property:          "Bien"
        user:              "Prestataire"

      document:
        file:              "Fichier"
        doc_type:          "Type de document"
        property:          "Bien"

      user:
        email:             "E-mail"
        password:          "Mot de passe"
        password_confirmation: "Confirmation du mot de passe"
        role:              "Rôle"

  # ─── Enums : valeurs affichables en français ──────────────────────────
  # Utilisés via property.property_type_i18n ou directement dans la vue.
  enums:
    property:
      property_type:
        appartement: "Appartement"
        maison:      "Maison"
      status:
        draft:     "Brouillon"
        analyzing: "En cours d'analyse"
        analyzed:  "Analysé"
        published: "Publié"

    user:
      role:
        proprietaire: "Propriétaire"
        prestataire:  "Prestataire"
        admin:        "Administrateur"

    offer:
      offer_type:
        renovation:      "Rénovation"
        financement:     "Financement"
        achat_promoteur: "Achat promoteur"
      status:
        pending:  "En attente"
        accepted: "Acceptée"
        rejected: "Refusée"
        expired:  "Expirée"

  # ─── Plages de revenus (utilisé dans la vue Aides) ──────────────────
  income_brackets:
    tres_modeste:   "Très modestes"
    modeste:        "Modestes"
    intermediaire:  "Intermédiaires"
    superieur:      "Supérieurs"
