<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Lotys</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #f9fafb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: white;
      border-bottom: 1px solid #f3f4f6;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    nav .logo {
      font-size: 1.2rem;
      font-weight: 900;
      color: #059669;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    nav .tagline {
      font-size: 0.875rem;
      color: #6b7280;
      border-left: 1px solid #e5e7eb;
      padding-left: 12px;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .number {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #e5e7eb;
      margin-bottom: 8px;
    }
    .number span { color: #059669; }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #111827;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .btn-primary {
      display: inline-block;
      background: #059669;
      color: white;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 0.9375rem;
      transition: background 0.15s;
      width: 100%;
      max-width: 320px;
    }
    .btn-primary:hover { background: #047857; }
    .btn-secondary {
      display: inline-block;
      border: 1px solid #e5e7eb;
      background: white;
      color: #374151;
      font-weight: 500;
      padding: 13px 32px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 0.875rem;
      transition: background 0.15s;
      width: 100%;
      max-width: 320px;
    }
    .btn-secondary:hover { background: #f9fafb; }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: #9ca3af;
      border-top: 1px solid #f3f4f6;
    }
    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
      .number { font-size: 4.5rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">
      🏠 Lotys
    </a>
    <span class="tagline">L'immobilier, enfin lisible.</span>
  </nav>

  <main>
    <div class="card">
      <div class="number">4<span>0</span>4</div>
      <h1>Page introuvable</h1>
      <p>Cette page n'existe pas ou a été déplacée.<br>Retournez à l'accueil ou analysez votre bien.</p>
      <div class="actions">
        <a href="/" class="btn-primary">← Retour à l'accueil</a>
        <a href="/properties/new" class="btn-secondary">🏠 Analyser mon bien gratuitement</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; Lotys &nbsp;·&nbsp;
    <a href="/mentions-legales" style="color:#9ca3af;">Mentions légales</a> &nbsp;·&nbsp;
    <a href="/contact" style="color:#9ca3af;">Contact</a>
  </footer>
</body>
</html>
